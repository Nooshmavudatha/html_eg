<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex_Row_Layout</title>
    <style>
        .container{
            display: flex;
            flex-direction: row;
            gap: 20px;
            justify-content: center;
        }
        .box{
            width: 200px;
            height: 200px;
            border: 2px solid blue;
        }
        .box img{
            width: 200px;
            height: 200px;
            object-fit: cover;
        }
    </style>
</head>
<body>
    <h2>Tulip Gallery --Flex Row Layout</h2>
    <div class="container">
        <div class="box"><img src="tulip.jpg" alt="tulip"></div>
        <div class="box"><img src="tulip.jpg" alt="tulip"></div>
        <div class="box"><img src="tulip.jpg" alt="tulip"></div>
        <div class="box"><img src="tulip.jpg" alt="tulip"></div>
    </div>
</body>
</html>
