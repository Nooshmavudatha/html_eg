<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>
<body>
    <body bgcolor="pink">
    <h1 align="center">Student Registration Form</h1>
    <form>
        <center>
        <table col>
            <tr>
                <th>Roll No:</th>
                <td><input type="text" size="40" name="roll no"/></td>
            </tr>
            <tr>
                <th>Student Name:</th>
                <td><input type="text" size="40" name="Student name" value="first name"/>-
                
                <input type="text" size="40" name="Student name" value="last name"/></td>
            </tr>
            <tr>
                <th>Father's Name:</th>
                <td><input type="text" size="40" name="father's name"/></td>
            </tr>
            <tr>
                <th>Date Of Birth:</th>
                <td><input type="text" size="10" name="date" value="date"/>-
                <input type="text" size="10" name="month" value="month"/>-
                <input type="text" size="10" name="year" value="year"/>(DD-MM-YYYY)</td>
            </tr>
        </table>
        <br>
        <button>Submit</button>
        </center>
    </form>
</body>
</html>
