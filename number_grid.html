<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number_Grid</title>
    <style>
        .container{
            display:grid;
            border: 1px solid aqua;
            grid-row: 25% 25% 25% 25%;
            grid-column: 25% 25% 25% 25%;
            gap: 1px;
        }
        .header{
            background-color: orangered;
            height: 25vh;
            grid-row: 1/2;
            grid-column: 1/5;
        }
        .sb1{
            background-color: hotpink;
            height: 25vh;
            grid-row: 2/3;
            grid-column: 1/5;
        }
        .sb2{
            background-color: hotpink;
            height: 25vh;
            grid-row: 2/3;
            grid-column: 2/3;
        }
        .sb3{
            background-color: hotpink;
            height: 25vh;
            grid-row: 2/3;
            grid-column: 3/4;
        }
        .sb{
            background-color: rgb(88, 230, 213);
            height: 50vh;
            grid-row: 2/4;
            grid-column: 4/5;
        }
        .main{
            background-color: crimson;
            height: 25vh;
            grid-row: 3/4;
            grid-column: 1/4;
        }
        .footer{
            background-color: indianred;
            height: 25vh;
            grid-row: 4/5;
            grid-column: 1/5;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="header">Header element
            <span>Home</span>
            <span>About</span>
            <span>Login</span>
        </div>
        <div class="sb1">Small box 1</div>
        <div class="sb2">Small box 2</div>
        <div class="sb3">Small box 3</div>
        <div class="sb">Side bar</div>
        <div class="main">main content</div>
        <div class="footer">footer part</div>
    </div>
</body>
</html>
